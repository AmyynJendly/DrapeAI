spring.application.name=drapeai-backend
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/drapeai}
server.port=8080

# AI Try-On Configuration
vto.hf.token=${HF_TOKEN:}
vto.colab.url=${VTO_COLAB_API_URL:}

# Allow large base64 image payloads (up to 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.mvc.servlet.max-body-post-size=20MB
